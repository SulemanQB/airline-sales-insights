name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: python -m asi.cli all --out ci-output
      - uses: actions/upload-artifact@v4
        with:
          name: commercial-pack
          path: |
            ci-output/Commercial_Pack.xlsx
            ci-output/OnePager.pdf
            ci-output/OnePager.html
            ci-output/findings.json
